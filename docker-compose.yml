name: marshruty

x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./.env
  networks:
    - marshruty_network
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_started

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    container_name: marshruty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_USER}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marshruty_network

  nats:
    image: nats:2.10-alpine
    container_name: marshruty_nats
    restart: unless-stopped
    command: ["-js"]
    networks:
      - marshruty_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: marshruty_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - marshruty_network

  nginx:
    image: nginx:alpine
    container_name: marshruty_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/user1/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - frontend_web
      - frontend_admin
      - auth_service
      - user_service
      - map_service
      - search_hq_service
      - archive_service
      - route_service
      - media_service
      - admin_service
      - minio
    networks:
      - marshruty_network

  auth_service:
    <<: *backend-common
    container_name: marshruty_auth
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8001
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BOOTSTRAP_ROOT_EMAIL: ${BOOTSTRAP_ROOT_EMAIL}
      BOOTSTRAP_ROOT_PASSWORD: ${BOOTSTRAP_ROOT_PASSWORD}

  user_service:
    <<: *backend-common
    container_name: marshruty_user
    build:
      context: ./backend/user_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8002
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/users
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_SERVICE_URL: http://auth_service:8001
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}

  map_service:
    <<: *backend-common
    container_name: marshruty_map
    build:
      context: ./backend/map_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8003
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/map
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user_service:8002

  search_hq_service:
    <<: *backend-common
    container_name: marshruty_search_hq
    build:
      context: ./backend/search_hq_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8004
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/search_hq
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user_service:8002
      EXCURSION_SITE_RADIUS_M: ${EXCURSION_SITE_RADIUS_M:-500}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL}

  archive_service:
    <<: *backend-common
    container_name: marshruty_archive
    build:
      context: ./backend/archive_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8005
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/archive
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user_service:8002
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}

  route_service:
    <<: *backend-common
    container_name: marshruty_route
    build:
      context: ./backend/route_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8006
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/routes
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ARCHIVE_SERVICE_URL: http://archive_service:8005
      MAP_SERVICE_URL: http://map_service:8003
      MEDIA_SERVICE_URL: http://media_service:8007
      USER_SERVICE_URL: http://user_service:8002
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}

  media_service:
    <<: *backend-common
    container_name: marshruty_media
    build:
      context: ./backend/media_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8007
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/media
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ARCHIVE_SERVICE_URL: http://archive_service:8005
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN}

  media_render_worker:
    <<: *backend-common
    container_name: marshruty_media_render_worker
    build:
      context: ./backend/media_render_worker
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      MEDIA_SERVICE_URL: http://media_service:8007
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      REPLICATE_MODEL_VERSION: ${REPLICATE_MODEL_VERSION}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      MINIO_BUCKET: media

  admin_service:
    <<: *backend-common
    container_name: marshruty_admin
    build:
      context: ./backend/admin_service
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: main:app
        SERVICE_PORT: 8010
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_ALGORITHM: ${ADMIN_JWT_ALGORITHM}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      MFA_TOKEN_TTL_MINUTES: ${MFA_TOKEN_TTL_MINUTES}
      TOTP_ISSUER_NAME: ${TOTP_ISSUER_NAME}
      TOTP_VALID_WINDOW: ${TOTP_VALID_WINDOW}
      REQUIRE_TOTP: ${REQUIRE_TOTP}
      RECOVERY_CODES_COUNT: ${RECOVERY_CODES_COUNT}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      AUTH_SERVICE_URL: http://auth_service:8001
      USER_SERVICE_URL: http://user_service:8002
      MAP_SERVICE_URL: http://map_service:8003
      SEARCH_HQ_SERVICE_URL: http://search_hq_service:8004
      ARCHIVE_SERVICE_URL: http://archive_service:8005
      ROUTE_SERVICE_URL: http://route_service:8006
      MEDIA_SERVICE_URL: http://media_service:8007

#  ai_service:
#    build:
#      context: ./backend/ai_service
#      dockerfile: Dockerfile
#    container_name: marshruty_ai
#    restart: unless-stopped
#    environment:
#      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
#      - YANDEX_API_KEY=${YANDEX_API_KEY}
#      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
#      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
#      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
#    networks:
#      - marshruty_network

  # Мобильное приложение на сервер не выкатываем: оно живёт в APK и ходит сюда
  # только за API через nginx. Локально веб-версия мобилки — `npm run dev` в
  # frontend/client.

  frontend_web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: marshruty_frontend_web
    restart: unless-stopped
    networks:
      - marshruty_network

  frontend_admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: marshruty_frontend_admin
    restart: unless-stopped
    networks:
      - marshruty_network

volumes:
  pg_data:
  minio_data:

networks:
  marshruty_network:
    driver: bridge
