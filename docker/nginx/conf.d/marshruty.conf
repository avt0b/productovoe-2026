server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://frontend_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://frontend_admin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /web/ {
        proxy_pass http://frontend_web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/auth/ {
        # auth_service монтирует свои роуты под собственным префиксом /auth
        # (api/routers/auth.py: APIRouter(prefix="/auth")), поэтому здесь
        # срезаем только /api, а не всю /api/auth/ — иначе /api/auth/register
        # улетал бы на auth_service как /register (404).
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://auth_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        proxy_pass http://user_service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/map/ {
        proxy_pass http://map_service:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/search/ {
        proxy_pass http://search_hq_service:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/archive/ {
        proxy_pass http://archive_service:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/routes/ {
        # В отличие от /api/auth/ выше — здесь срезаем всю /api/routes/, а не
        # только /api. route_service слушает ровно "/routes" (без дублирования),
        # а фронт (frontend/web/src/modules/routes/api.js) сам зовёт его как
        # /api/routes/routes — так исторически сложилось из-за поведения
        # vite-прокси в dev (там тоже срезается весь /api/routes целиком).
        # Полный срез здесь даёт тот же результат: /api/routes/routes -> /routes.
        proxy_pass http://route_service:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/media/ {
        proxy_pass http://media_service:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ignore_client_abort on;
    }
}
