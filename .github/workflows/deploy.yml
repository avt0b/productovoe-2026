name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # set -e: не удался pull (например, правки на сервере мешают) — дальше
          # не идём, а не пересобираем старый код. Сначала сборка при работающих
          # контейнерах, потом `up -d` пересоздаёт только изменившиеся — сайт
          # лежит секунды, а не всю сборку. --remove-orphans убирает контейнеры
          # сервисов, которых больше нет в docker-compose.yml.
          script: |
            set -e
            cd ~/productovoe-2026
            git pull --ff-only origin main
            docker compose build
            docker compose up -d --remove-orphans
            # Конфиги nginx примонтированы с диска, а nginx читает их только на
            # старте: без перезапуска он держал бы старые, если поменялись лишь они.
            docker compose restart nginx
            docker image prune -f
            docker compose ps
