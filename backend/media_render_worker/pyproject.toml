[project]
name = "media-render-worker"
version = "0.1.0"
description = "Воркер рендера «Живого фото»: SpeechKit (голос) + Replicate/SadTalker (липсинк) — «Маршруты победы»"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
