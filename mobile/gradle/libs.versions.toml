# Версии взяты те, что уже лежат в локальном кэше Gradle, — сборка не тянет лишнего.
[versions]
agp = "9.3.2"
# 2.4.10, а не встроенная в AGP 9.3.2 2.2.10: ARSceneView собран Kotlin 2.4.10,
# и компилятор младше его метаданные не читает. AGP берёт KGP с classpath
# старше своего, если тот объявлен в корневом plugins { … apply false }.
kotlin = "2.4.10"
coreKtx = "1.16.0"
lifecycle = "2.9.4"
composeBom = "2026.02.01"
activityCompose = "1.8.2"
camerax = "1.4.2"
coroutines = "1.9.0"
# Filament отдельно не подключаем: SceneView везёт свой (1.72.1), и его материалы
# собраны под эту версию движка. Более новый Filament поднял бы версию и уронил
# загрузку материалов на старте.
sceneview = "4.34.0"
# Чистая Java без Android-зависимостей: только декодер, ~0.5 МБ в APK.
zxing = "3.5.3"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Явно, а не транзитивно: анимации и foundation нужны напрямую.
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# CameraX: только превью, анализ кадров и съёмка не нужны.
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# AR-сцена: сессия ARCore, фон камеры, Filament, glTF и трекинг картинок.
arsceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "sceneview" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
